<div class="controls text-center">
  <div class="row w-75 mt-5">
    <div class="col-6 mt-5">
      <button class=" m-3 btn btn-primary" (click)="addField('username')">Add Username</button>
      <button class=" m-3 btn btn-primary" (click)="addField('date')">Add Date</button>
      <button class=" m-3 btn btn-primary" (click)="addField('body')">Add Body Content</button><br />
      <div class="m-3">
        <label>Upload Certificate Template:
          <input class="form-control " type="file" (change)="setCertificateBackground($event)">
        </label>
      </div>
      <div class="m-3">
        <label class="form-label">Add Company Logo:
          <input class="form-control" type="file" (change)="addImage($event, 'logo')" />
        </label>
      </div>
      <div class="m-3">
        <label class="form-label">Add Signature:
          <input class="form-control" type="file" (change)="addImage($event, 'signature')" />
        </label>
      </div>
      <div class="m-3">
        <button class="btn btn-success m-3" (click)="download()">Download</button>
      </div>
      <div *ngIf="selectedCoords">
        <table class="table table-striped table-warning w-50 mx-auto m-3">
          <thead>
            <tr>
              <th>X</th>
              <th>Y</th>
              <th>Width</th>
              <th>Height</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>{{ selectedCoords.x }}</td>
              <td>{{ selectedCoords.y }}</td>
              <td>{{ selectedCoords.width }}</td>
              <td>{{ selectedCoords.height }}</td>
            </tr>
          </tbody>


        </table>
      </div>
    </div>
    <div class="col-6">
      <p><em>Shift + Drag to pan the canvas</em></p>
      <div class="canvas-wrapper drop-area" [class.dragover]="dragOver" (drop)="setCertificateBackground($event,true)"
        (dragleave)="onDragLeave($event)" (dragover)="allowDrop($event)">

        <canvas #htmlCanvas height="700" width="1000"></canvas>
      </div>
    </div>
  </div>

  <!-- Excel controls -->
  <div class="row w-75 my-4 mx-auto" style="min-height: 50vh;">
    <div class="col-6 mx-auto">
      <label class="form-label">Upload Excel Data: </label>
      <input type="file" class="form-control" (change)="onExcelUpload($event)" accept=".xlsx, .xls,.csv" />
      <div class="mt-3" >
        <button class="btn btn-success" (click)="generateCertificates()">Generate Certificates from Excel</button>
      </div>
 
    </div>
    <br />
  </div>
</div>
